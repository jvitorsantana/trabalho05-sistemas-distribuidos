services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rede-mensagens

  gerador:
    build:
      context: ./app
      args:
        MODULO: gerador
    container_name: gerador
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      MENSAGENS_POR_SEGUNDO: 5
      ERRO_A_CADA: 10
    networks:
      - rede-mensagens

  consumidor-sentimento:
    build:
      context: ./app
      args:
        MODULO: consumidor-sentimento
    container_name: consumidor-sentimento
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      ATRASO_MS: 1000
    networks:
      - rede-mensagens

  consumidor-suporte:
    build:
      context: ./app
      args:
        MODULO: consumidor-suporte
    container_name: consumidor-suporte
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      ATRASO_MS: 1000
    networks:
      - rede-mensagens

networks:
  rede-mensagens:
    driver: bridge